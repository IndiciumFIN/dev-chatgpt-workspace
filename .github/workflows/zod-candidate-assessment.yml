# Experimento não destrutivo: candidato de correção para FIND-SEC-001.
# Não faz push de package.json / package-lock.json e não usa auto-fix.
name: Candidato Zod — avaliação de segurança
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zod-candidate-assessment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Gerar proposta de atualização mínima, sem instalação nesta etapa
        run: npm install zod@4.6.7 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Instalar dependências conforme lockfile proposto
        run: npm ci
      - name: Confirmar versão instalada
        run: node -e "const v=require('./node_modules/zod/package.json').version; if(v!=='4.6.7')process.exit(1); console.log('Candidate Zod:',v)"
      - name: Reavaliar inventário completo e dependências produtivas
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Reproduzir todos os gates do build
        run: npm run build:spa
      - name: Confirmar arquivos resultantes
        run: |
          test -s .vercel/output/static/index.html
          test -s .vercel/output/static/robots.txt
          git diff --check
          git diff --stat -- package.json package-lock.json
      - name: Arquivar candidato para comparação e revisão
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sec-zod-candidate-package-files
          path: |
            package.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 7
