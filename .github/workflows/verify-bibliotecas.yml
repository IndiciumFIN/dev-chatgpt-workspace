# Read-only CI: never push, merge or deploy from this workflow.
name: Verificar bibliotecas — sem deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Validar PMO canônico e histórico
        run: node scripts/check-pmo-queue.mjs
      - name: Verificar integridade do inventário transversal candidato (não conformidade)
        run: node scripts/check-transversal-catalog.mjs
      - name: Auditar 18 instâncias ISO com schemas canônicos, hashes e testes negativos (sem admissão)
        run: |
          python3 -m pip install --disable-pip-version-check "jsonschema==4.25.1"
          python3 scripts/verify-transversal-iso-materialization.py
      - name: Auditar 25 fontes públicas candidatas contra originais e schemas (sem admissão)
        run: python3 scripts/verify-transversal-public-materialization.py
      - name: Verificar índice mecânico de 21 atos públicos por offsets e hashes (sem interpretar)
        run: python3 scripts/verify-transversal-public-article-index.py
      - name: Validar lote CKO/COFEN e hashes dos registros
        run: node scripts/check-candidate-find-register.mjs
      - name: Verificar inventário integral do ZIP Grok e proveniência de documentos
        run: |
          # O ZIP original não entra no deploy nem no repositório.
          # Falha se um dos 102 registros não tiver classificação,
          # se um dos sete documentos migrados sofrer alteração, ou
          # se itens em HOLD forem importados sem novo aceite.
          python3 scripts/check-grok-workspace-intake.py
          python3 scripts/check-grok-workspace-intake.test.py
      # O checkout integral contém evidências que não devem integrar o deploy.
      # Primeiro executar os gates normativos, depois simular .vercelignore.
      - name: Conferir 176 entradas históricas CE, hashes Git e testes negativos Python
        run: |
          python3 scripts/ce-legacy-reconcile.py verify --target .
          python3 scripts/ce-legacy-reconcile.test.py
      - name: Validar entradas obrigatórias antes dos testes (sem excluir fontes)
        run: |
          critical_files=(
            audit/baseline/v0.1.0/file-register.json
            audit/registers/current.json
            contracts/cko-tokens/dist/_cko-universal-content-tokens.scss
            contracts/cko-tokens/dist/cko-universal-content-tokens.css
            contracts/cko-tokens/dist/cko-universal-content-tokens.ts
          )
          ignored="$(git ls-files --cached --ignored --exclude-from=.vercelignore -- "${critical_files[@]}")"
          if [ -n "$ignored" ]; then
            echo "::error::.vercelignore descarta entradas obrigatorias dos gates"
            printf '%s\n' "$ignored"
            exit 1
          fi
          for file in "${critical_files[@]}"; do
            test -s "$file" || { echo "::error::Falta arquivo de build: $file"; exit 1; }
          done
          echo "PASS: entradas críticas verificadas antes dos testes; quarantena histórica continua disponível para checagem de hash"
      - run: npm ci
      - name: Auditoria de dependências bloqueante
        run: npm audit --audit-level=high
      - run: node scripts/test-admin-console.mjs
      - run: npm run typecheck
      - run: node scripts/check-generated-fresh.mjs
      - run: node scripts/check-cko-packages.mjs
      - run: node scripts/check-contract-coverage.mjs
      - name: Verificar separação do catálogo público de conteúdo em HOLD
        run: node scripts/generate-public-fun-facts.mjs --check
      - run: npm test
      - run: node scripts/audit-execution-gates.mjs
      - name: Simular exclusões do upload Vercel após testes completos
        run: |
          # Os testes de hashes já foram executados com toda a fonte.
          # Agora a simulação do pacote exclui artefatos legados antes do build.
          git ls-files --cached --ignored --exclude-from=.vercelignore -z | xargs -0 -r rm -f
          test ! -e intake/legacy-ce/docs/AGENTS.md
          test ! -e intake/legacy-ce/docs/SETUP_GITHUB_PAT.md
          test ! -e intake/legacy-ce/contracts/fontes/cofen_dou.json
          test ! -e .grok/skills/og/SKILL.md
          echo "PASS: evidências legadas excluídas do pacote; nenhum teste de hash foi contornado"
      - run: npm run build:spa
      - name: Verificar que artefatos estáticos não contêm conteúdo editorial em HOLD
        run: node scripts/ce-audit-public-editorial-bundle.mjs
      - name: Verificar que candidatos clínicos não entram no JavaScript público
        run: node scripts/ce-audit-candidate-clinical-bundle.mjs
      - name: Verificar arquivos estaticos basicos
        run: test -s .vercel/output/nitro.json && test -d .vercel/output/functions/__server.func && test -s .vercel/output/static/sitemap.xml && test -s .vercel/output/static/robots.txt
