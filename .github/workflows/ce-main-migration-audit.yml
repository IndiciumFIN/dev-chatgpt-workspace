name: CE main migration inventory (read only)
on:
  push:
    branches: [plan/pmokernel-finalization-20261031]
    paths:
      - 'registers/governance/main-migration-scope.v1.json'
      - 'scripts/audit-main-migration.mjs'
      - 'scripts/lib/main-migration-core.mjs'
      - 'scripts/main-migration-core.test.mjs'
      - 'scripts/lib/corpus-index.mjs'
      - 'scripts/corpus-index.test.mjs'
      - 'scripts/index-source-corpus.mjs'
      - '.github/workflows/ce-main-migration-audit.yml'
  pull_request:
    paths:
      - 'registers/governance/main-migration-scope.v1.json'
      - 'scripts/audit-main-migration.mjs'
      - 'scripts/lib/main-migration-core.mjs'
      - 'scripts/main-migration-core.test.mjs'
      - 'scripts/lib/corpus-index.mjs'
      - 'scripts/corpus-index.test.mjs'
      - 'scripts/index-source-corpus.mjs'
      - '.github/workflows/ce-main-migration-audit.yml'
permissions:
  contents: read
jobs:
  canonical-inventory:
    if: github.repository == 'IndiciumFIN/dev-chatgpt-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate with full history (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test inventory fail-closed contract
        run: node --test scripts/main-migration-core.test.mjs
      - name: Fetch source branches for read-only comparison
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Generate exhaustive Git blob/path collision candidate report
        run: node scripts/audit-main-migration.mjs --output audit-evidence/main-migration/runtime-report.json
      - name: Assert 23 branches inspected and release still blocked
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('audit-evidence/main-migration/runtime-report.json','utf8'));
          if(r.summary.branchesExpected!==23 || r.summary.branchesInspected!==23) throw Error('INCOMPLETE_BRANCH_INVENTORY');
          if(r.summary.sourceFailures) throw Error('DRIFT_OR_MISSING_SOURCES');
          if(r.releaseGate!=='HOLD_HUMAN' || r.migrationComplete!==false) throw Error('INVALID_RELEASE_CLAIM');
          console.log('PASS: all 23 branch source refs audited, migration still HOLD_HUMAN');
          console.log('SUMMARY:',JSON.stringify(r.summary));
          NODE
      - name: Test source-corpus provenance and licensing fail-closed rules
        run: node --test scripts/corpus-index.test.mjs
      - name: Extract 8250 source pages from unrelated branch into temporary workspace (read only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/ce-source-intake
          git archive --format=tar 'refs/remotes/origin/feat/projection-unica-f0-suite-real' artifacts/fonte/corpus/paginas | tar -xf - -C .tmp/ce-source-intake
      - name: Index the entire source corpus with 250-page progress checkpoints
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse refs/remotes/origin/feat/projection-unica-f0-suite-real)"
          node scripts/index-source-corpus.mjs \
            --source-root .tmp/ce-source-intake/artifacts/fonte/corpus/paginas \
            --expected 8250 \
            --source-commit "$source_sha" \
            --output audit-evidence/corpus-intake/source-index.v1.jsonl \
            --summary audit-evidence/corpus-intake/source-summary.v1.json
      - name: Assert full index coverage without authorizing publication
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('audit-evidence/corpus-intake/source-summary.v1.json','utf8'));
          if(r.validation.observedCount!==8250 || !r.validation.complete)throw Error('INCOMPLETE_CORPUS');
          if(r.publicationAllowed!==false || r.releaseGate!=='HOLD_HUMAN')throw Error('INVALID_RELEASE_CLAIM');
          console.log('PASS: all 8250 source JSON pages indexed as candidates; rights and clinical review remain blocked');
          console.log('CORPUS:',JSON.stringify(r.validation));
          NODE
      - name: Upload indexed corpus metadata and audit summary (GitHub Actions artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ce-source-corpus-candidate-index
          path: |
            audit-evidence/corpus-intake/source-index.v1.jsonl
            audit-evidence/corpus-intake/source-summary.v1.json
          retention-days: 30
      - name: Upload versioned-method candidate report (GitHub Actions artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ce-main-migration-source-collision-report
          path: audit-evidence/main-migration/runtime-report.json
          retention-days: 30
# No merge, no file contents exported, no DB writes or production release.
