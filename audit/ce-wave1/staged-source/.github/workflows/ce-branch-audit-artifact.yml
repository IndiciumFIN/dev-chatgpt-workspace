name: Branch audit evidence archive (read-only, no release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Archive existing report without altering Git
        run: node scripts/governance/archive-audit-candidate.mjs /tmp/ce-audit-evidence
      - name: Upload archive & hashes for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ce-branch-audit-evidence
          path: /tmp/ce-audit-evidence/
          retention-days: 90
