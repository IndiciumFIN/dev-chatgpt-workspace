name: WU-TRIB audit-only synthetic capacity
on:
  push:
    branches:
      - wutrib/audit-integral-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-benchmark:
    if: github.ref == 'refs/heads/wutrib/audit-integral-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Seven deterministic domain agents
        run: npm run verify
      - name: Existing regression tests
        run: npm test
      - name: Isolated bounded synthetic capacity benchmark
        run: |
          set -euo pipefail
          timeout 180s node --expose-gc --max-old-space-size=384 benchmarks/synthetic_capacity.mjs | tee "$RUNNER_TEMP/wutrib-benchmark.log"
          grep -q WUTRIB_BENCH_SUMMARY "$RUNNER_TEMP/wutrib-benchmark.log"
      - name: Assert benchmark cannot access external systems
        run: |
          set -euo pipefail
          ! grep -E 'https?://|service_role|fetch\(' benchmarks/synthetic_capacity.mjs
          echo 'No Vercel load; no database writes; synthetic CPU/RSS evidence only.'
