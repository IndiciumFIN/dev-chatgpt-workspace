name: Prévia administrativa — browser e capturas
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/admin/**'
      - 'src/components/local/local-workbench-page.tsx'
      - 'src/styles/admin-console.css'
      - 'scripts/admin-ux-e2e.mjs'
      - '.github/workflows/admin-ux-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/admin/**'
      - 'src/components/local/local-workbench-page.tsx'
      - 'src/styles/admin-console.css'
      - 'scripts/admin-ux-e2e.mjs'
      - '.github/workflows/admin-ux-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_AUTH_ENABLED: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Instalar Chromium apenas no executor na nuvem
        run: npx playwright install --with-deps chromium
      - name: Iniciar servidor e executar jornadas do administrador
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/with-app-env.mjs vite dev --host 127.0.0.1 --port 4173 > /tmp/admin-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/admin-vite.log; exit 1; fi
            if curl -fsS http://127.0.0.1:4173/admin -o /dev/null 2>/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:4173/admin -o /dev/null || { cat /tmp/admin-vite.log; exit 1; }
          node scripts/admin-ux-e2e.mjs
      - name: Guardar as evidências para auditoria
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-ux-evidencias
          path: |
            audit-evidence/admin-ux/*.png
            /tmp/admin-vite.log
          if-no-files-found: warn
          retention-days: 7
