name: CE header Entrar candidate (no deploy or release)
on:
  push:
    branches: [fix/shell-consolidation]
    paths:
      - 'src/components/site/shell.tsx'
      - 'src/routes/login.tsx'
      - 'scripts/header-entry.test.mjs'
      - '.github/workflows/ce-header-entry-candidate.yml'
  pull_request:
    paths:
      - 'src/components/site/shell.tsx'
      - 'src/routes/login.tsx'
      - 'scripts/header-entry.test.mjs'
      - '.github/workflows/ce-header-entry-candidate.yml'
permissions:
  contents: read
jobs:
  header-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test topbar and gated auth behavior
        run: node --test scripts/header-entry.test.mjs
      - name: Typecheck with canonical route generation
        run: npm run typecheck
# Candidate only. PR includes pre-existing CSS divergence; no merge authorization.
