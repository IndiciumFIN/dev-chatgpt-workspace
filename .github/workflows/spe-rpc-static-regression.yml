name: Simulados RPC and source-integrity static regressions

on:
  push:
    branches:
      - simulados-enfermagem-db-canonico
    paths:
      - 'scripts/spe_audit_rpc_answers.py'
      - 'scripts/test_spe_audit_rpc_answers.py'
      - 'scripts/spe_check_original_db_archive.py'
      - 'scripts/test_spe_check_original_db_archive.py'
      - '.github/workflows/spe-rpc-static-regression.yml'
      - 'docs/simulados-enfermagem/W12_FIND_RPC_SCHEMA_GRANTS_20261031.md'
      - 'docs/simulados-enfermagem/W15_FIND_ORIGINAL_ARCHIVE_INTEGRITY_20261031.md'
      - 'docs/simulados-enfermagem/W16_FIND_SQL_LEXICAL_SPOOFING_20261031.md'
  pull_request:
    paths:
      - 'scripts/spe_audit_rpc_answers.py'
      - 'scripts/test_spe_audit_rpc_answers.py'
      - 'scripts/spe_check_original_db_archive.py'
      - 'scripts/test_spe_check_original_db_archive.py'
      - '.github/workflows/spe-rpc-static-regression.yml'
      - 'docs/simulados-enfermagem/W12_FIND_RPC_SCHEMA_GRANTS_20261031.md'
      - 'docs/simulados-enfermagem/W15_FIND_ORIGINAL_ARCHIVE_INTEGRITY_20261031.md'
      - 'docs/simulados-enfermagem/W16_FIND_SQL_LEXICAL_SPOOFING_20261031.md'

permissions:
  contents: read

jobs:
  rpc-static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run deterministic RPC grant regressions
        run: python -m unittest discover -s scripts -p 'test_spe_audit_rpc_answers.py' -v
      - name: Run original-archive checker regressions on synthetic fixtures only
        run: python -m unittest discover -s scripts -p 'test_spe_check_original_db_archive.py' -v
      - name: Preserve private archive and runtime HOLD
        run: |
          echo 'Original private ZIP is NOT committed to the repository or downloaded by CI.'
          echo '47 migrations and 17 pgTAP tests: W15 SOURCE_INTEGRITY_VERIFIED_LOCALLY; W16 LEXICAL_PREFLIGHT_RECHECK_PENDING; DB_EXECUTION_NOT_RUN.'
          echo 'Kernel admission, independent review and release: HOLD_HUMAN.'
