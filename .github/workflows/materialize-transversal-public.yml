name: Materializar documentos públicos — contratos existentes e hashes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-transversal-public.yml'
permissions:
  contents: read
jobs:
  materialize:
    if: github.repository == 'IndiciumFIN/dev-chatgpt-workspace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Instalar verificador de schema
        run: python3 -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Materializar 25 documentos públicos de snapshot imutável
        run: python3 scripts/materialize-transversal-public.py
      - name: Conferir scope e hashes já no checkout
        run: |
          git add -- registers/governance/transversal-source-instances/public registers/governance/transversal-standards-candidates.v1.json registers/pmo/queue.v1.json
          git diff --cached --check
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              registers/governance/transversal-source-instances/public/*|registers/governance/transversal-standards-candidates.v1.json|registers/pmo/queue.v1.json) ;;
              *) echo "HOLD: unexpected staged file $path"; exit 1;;
            esac
          done
          node scripts/check-transversal-catalog.mjs
      - name: Commit candidatos sem alteração de fontes originais ou force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "HOLD: no changes"; exit 1; }
          git commit -m "chore(governance): materializar 25 fontes oficiais candidatas e evidências"
          git push origin HEAD:main
