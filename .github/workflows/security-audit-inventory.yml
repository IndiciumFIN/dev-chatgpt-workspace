# Diagnóstico somente leitura: não corrige pacotes, não altera lockfile e não faz deploy.
name: Auditoria inicial de dependências — FIND SEC
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-audit-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Coletar advisorys sem remediação automática
        run: |
          npm audit --json > security-audit-all.json || true
          npm audit --omit=dev --json > security-audit-production.json || true
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const report = file => {
            const source = JSON.parse(readFileSync(file,'utf8'));
            const vulnerabilities = Object.entries(source.vulnerabilities ?? {}).map(([pkg,v]) => ({
              name: pkg,
              severity: v.severity,
              isDirect: v.isDirect,
              via: (v.via ?? []).map(item => typeof item === 'string' ? item : {name:item.name,title:item.title,url:item.url,range:item.range}),
              fixAvailable: v.fixAvailable,
              range: v.range,
            }));
            return { totals:source.metadata?.vulnerabilities ?? {}, affected:vulnerabilities };
          };
          const output = { schemaVersion:1, scope:'dependency-audit', date:'2026-10-23', all: report('security-audit-all.json'), production:report('security-audit-production.json'), securityGate:'NOT_APPROVED_PENDING_REVIEW' };
          writeFileSync('security-summary.json',JSON.stringify(output,null,2)+'\n');
          console.log('DIAGNOSTIC_ONLY:',JSON.stringify({all:output.all.totals,production:output.production.totals,securityGate:output.securityGate}));
          NODE
      - name: Arquivar evidências da investigação
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sec-dependency-audit-inventory
          path: |
            security-audit-all.json
            security-audit-production.json
            security-summary.json
          retention-days: 14
          if-no-files-found: warn
