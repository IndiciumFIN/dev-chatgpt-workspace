name: Candidate visual validation (no deploy)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/capture-visual-evidence.mjs"
      - ".github/workflows/candidate-visual-validation.yml"
  push:
    branches: [integration/structural-overlay-20261101]
    paths:
      - "src/**"
      - "scripts/capture-visual-evidence.mjs"
      - ".github/workflows/candidate-visual-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_AUTH_ENABLED: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium and its Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Start local candidate and capture rendered pages
        run: |
          npm run dev > /tmp/candidate-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/candidate-vite.log; exit 1; fi
            if curl -fsS http://127.0.0.1:8080/ -o /dev/null 2>/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/ -o /dev/null || { cat /tmp/candidate-vite.log; exit 1; }
          node scripts/capture-visual-evidence.mjs
      - name: Upload screenshots and browser verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-visual-evidence
          path: |
            audit/visual/current/
            /tmp/candidate-vite.log
          if-no-files-found: warn
          retention-days: 7
