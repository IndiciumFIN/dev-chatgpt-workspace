name: OPA candidate policy validation

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/cko-governance/opa/**"
      - ".github/workflows/opa-candidate-validation.yml"
  push:
    branches: [integration/structural-overlay-20261101]
    paths:
      - "contracts/cko-governance/opa/**"
      - ".github/workflows/opa-candidate-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opa-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.22.0
      - name: Format and compile candidate policies
        run: >-
          opa fmt --fail --list
          contracts/cko-governance/opa/kernel_admission.rego
          contracts/cko-governance/opa/kernel_admission_test.rego
      - name: Test fail-closed OPA policies
        run: opa test --fail-on-empty -v contracts/cko-governance/opa
