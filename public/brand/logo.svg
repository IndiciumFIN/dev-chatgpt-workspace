<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Calculadoras de Enfermagem">
  <title>Calculadoras de Enfermagem</title>
  <!--
    Marca vetorial da Calculadoras de Enfermagem.
    Substitui public/brand/logo.webp, que tinha 48x32 px de raster e era exibido em
    64x64 — distorção anisotrópica de 1,5x (largura x1,33, altura x2,0).
    Vetor resolve a perda de resolução em qualquer densidade de tela.

    SOMENTE cores da paleta canônica (src/lib/site-data.ts, array `tokens`):
      Navy  #1A3E74 · Navy mid #1E4D8C · Sky #4A90E2 · Ink #0F2440
    Nenhuma cor fora da paleta. Sem raster embutido, sem <image>, sem base64.
    Legível a partir de 20 px eidêntica a 512 px.
  -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1A3E74"/>
  <!-- faixa de resultado na base: a régua da escala, em sky -->
  <rect x="14" y="47" width="36" height="5" rx="2.5" fill="#4A90E2"/>
  <rect x="14" y="38" width="36" height="5" rx="2.5" fill="#1E4D8C"/>
  <!-- cruz clínica em negativo, equilibrada no terço superior -->
  <path d="M28 12h8v10h10v8H36v10h-8V30H18v-8h10z" fill="#F9FAFB"/>
  <!-- traço de leitura em ink, ancora o olho sem competir com a cruz -->
  <rect x="14" y="55" width="20" height="3" rx="1.5" fill="#0F2440"/>
</svg>