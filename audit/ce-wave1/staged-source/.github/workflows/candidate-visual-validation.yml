name: Candidate visual evidence (requires independent review)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/capture-visual-evidence.mjs'
      - 'scripts/governance/attest-visual-capture.mjs'
      - '.github/workflows/candidate-visual-validation.yml'
  push:
    branches: [integration/structural-overlay-20261101]
    paths:
      - 'src/**'
      - 'scripts/capture-visual-evidence.mjs'
      - 'scripts/governance/attest-visual-capture.mjs'
      - '.github/workflows/candidate-visual-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_AUTH_ENABLED: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Capture actual pages, verify PNG hashes, bind run evidence
        run: |
          npm run dev > /tmp/candidate-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            kill -0 "$pid" || { cat /tmp/candidate-vite.log; exit 1; }
            if curl -fsS http://127.0.0.1:8080/ -o /dev/null 2>/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ -o /dev/null
          node scripts/capture-visual-evidence.mjs
          node scripts/governance/attest-visual-capture.mjs
      - name: Preserve evidence, NOT visual approval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-visual-evidence
          path: |
            audit/visual/current/
            /tmp/candidate-vite.log
          if-no-files-found: warn
          retention-days: 30
