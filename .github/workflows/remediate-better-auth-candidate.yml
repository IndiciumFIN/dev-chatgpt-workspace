name: Remediate better-auth candidate safely
on:
  push:
    branches:
      - simulados-enfermagem-db-canonico
    paths:
      - '.github/workflows/remediate-better-auth-candidate.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/remediate-better-auth-candidate.yml'

permissions:
  contents: write

concurrency:
  group: better-auth-candidate-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.repository == 'IndiciumFIN/dev-chatgpt-workspace' &&
      (github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'simulados-enfermagem-db-canonico'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: simulados-enfermagem-db-canonico
          persist-credentials: true
          fetch-depth: 1
      - name: Set up reviewed Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify this branch and scope
        run: |
          test "$(git branch --show-current)" = "simulados-enfermagem-db-canonico"
          test "$(node -p "require('./package.json').dependencies['better-auth']")" = "~1.6.30"
      - name: Update better-auth with lockfile as an atomic pair
        run: npm install --package-lock-only --save-exact --ignore-scripts better-auth@1.7.14
      - name: Migrate Generic OAuth client to documented Better Auth 1.7 API
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/lib/auth/client.ts';
          let source = readFileSync(path, 'utf8');
          const changes = [
            ['import { genericOAuthClient } from "better-auth/client/plugins";\\n', ''],
            ['  plugins: [genericOAuthClient()],\\n', ''],
            ['authClient.signIn.oauth2({\\n    providerId,', 'authClient.signIn.social({\\n    provider: providerId,'],
          ];
          for (const [before, after] of changes) {
            const original = before.replaceAll('\\n', '\n');
            const updated = after.replaceAll('\\n', '\n');
            if (!source.includes(original)) throw new Error('Unexpected OAuth client source; refusing blind migration: ' + original);
            source = source.replace(original, updated);
          }
          if (source.includes('genericOAuthClient') || source.includes('signIn.oauth2')) {
            throw new Error('Legacy OAuth client API remains');
          }
          writeFileSync(path, source);
          NODE
      - name: Reinstall from exact lockfile
        run: npm ci
      - name: Confirm critical and high vulnerabilities are resolved
        run: npm audit --audit-level=high
      - name: Check TypeScript contracts
        run: npm run typecheck
      - name: Run regression suite
        run: npm test
      - name: Verify production-like SPA build and gates
        run: npm run build:spa
      - name: Confirm only dependency manifests changed
        run: |
          git diff --exit-code -- . ':!package.json' ':!package-lock.json' ':!src/lib/auth/client.ts'
          test -n "$(git diff --name-only -- package.json package-lock.json src/lib/auth/client.ts)"
          test "$(git diff --name-only | sort)" = "$(printf 'package-lock.json\npackage.json' | sort)"
      - name: Commit validated dependency update to existing branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/lib/auth/client.ts
          git commit -m "fix(security): upgrade better-auth and migrate Generic OAuth after passing gates"
          git push origin HEAD:refs/heads/simulados-enfermagem-db-canonico
