# Temporary, read-only, no-secrets test: generate reproducible Nitro RC lockfile.
# This workflow does not commit, push, deploy, migrate or contact project databases.
name: CE Nitro RC lockfile candidate (no write)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ce-nitro-lock-candidate.yml
permissions:
  contents: read
jobs:
  lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'gate/g02-workspace-pr-policy-20261120' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Create Nitro RC package and lock candidate without scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact nitro@3.0.261103-rc --no-audit --no-fund
      - name: Validate candidate names and versions
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const pkg=JSON.parse(readFileSync("package.json"));
            const lock=JSON.parse(readFileSync("package-lock.json"));
            if(pkg.dependencies?.nitro!=="3.0.261103-rc" ||
              lock.packages?.["node_modules/nitro"]?.version!=="3.0.261103-rc" ||
              lock.packages?.[""]?.dependencies?.nitro!=="3.0.261103-rc") process.exit(1);
            console.log("PASS: Nitro RC dependency and lock candidate agree");
          '
      - name: Export lockfile pair for reviewed PR (no push)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ce-nitro-rc-lockfile
          path: |
            package.json
            package-lock.json
          retention-days: 3
          if-no-files-found: error
      - name: Verify exact lockfile hashes (no credentials)
        run: |
          printf '%s\n' '83ee0469fa4fa62ba0b14b228fd33605de83adcdd29896187a7ac0b0d23643d6  package.json' 'b8288b00ca117bb521f6de70bc1b1309b1f2d78f4d2ae1f606def242a541dd09  package-lock.json' | sha256sum -c -
      - name: Emit inert package-lock chunks for traceable Git blob upload
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          for (const file of ["package.json", "package-lock.json"]) {
            const content = readFileSync(file, "utf8");
            for (let offset = 0, part = 0; offset < content.length; offset += 2048, part++) {
              console.log("CE_LOCK_CHUNK|" + file + "|" + part + "|" + JSON.stringify(content.slice(offset, offset + 2048)));
            }
          }
          JS
