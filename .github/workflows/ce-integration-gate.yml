name: CE — integrated technical check (no release)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: ce-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ce-integration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Reject untrusted forks with failure, never SKIPPED
        env:
          CE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$GITHUB_REPOSITORY" = "IndiciumFIN/dev-chatgpt-workspace"
          test "$CE_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
      - name: Read-only checkout with complete base/head history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22 (no dependencies, no deploy)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Adversarial tests for path selection and fail-closed check aggregation
        run: node --test scripts/ce-integration-gate.test.mjs
      - name: Aggregate same PR HEAD GitHub Actions checks, deny missing/failing outcomes
        env:
          CE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ce-integration-gate.mjs
      - name: Retain non-sensitive per-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ce-integration-evidence-${{ github.run_id }}
          path: audit-evidence/ce-integration-gate/verdict.json
          if-no-files-found: warn
          retention-days: 14
# This check proves same-SHA technical CI only; no approvals, merges, DB writes or release.
