name: NCOS canonical evidence and editorial lineage (no deploy)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ""
      PGHOST: ""
      CI: "true"
    steps:
      - name: Checkout canonical candidate without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate negative examples for normative and editorial evidence
        run: node --test scripts/ncos-source-lineage.test.mjs
      - name: Reconcile actual CKO source-first evidence and fail closed
        run: node scripts/ncos-source-lineage-audit.mjs --enforce
      - name: Retain candidate lineages and blockers even if gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ncos-cko-source-first-lineage
          path: audit-evidence/ncos-canonical-source-lineage/
          if-no-files-found: warn
          retention-days: 30
