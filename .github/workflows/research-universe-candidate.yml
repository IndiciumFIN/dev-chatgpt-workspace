name: Research Universe 36 coverage
on:
  push:
    branches: [feat/research-all-tools-candidate-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22" }
      - run: node scripts/audit-research-universe.mjs
      - run: node --test scripts/research-supabase-bridge.test.mjs
