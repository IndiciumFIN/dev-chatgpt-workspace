name: Simulados RPC static regressions

on:
  push:
    branches:
      - simulados-enfermagem-db-canonico
    paths:
      - 'scripts/spe_audit_rpc_answers.py'
      - 'scripts/test_spe_audit_rpc_answers.py'
      - '.github/workflows/spe-rpc-static-regression.yml'
      - 'docs/simulados-enfermagem/W12_FIND_RPC_SCHEMA_GRANTS_20261031.md'
  pull_request:
    paths:
      - 'scripts/spe_audit_rpc_answers.py'
      - 'scripts/test_spe_audit_rpc_answers.py'
      - '.github/workflows/spe-rpc-static-regression.yml'
      - 'docs/simulados-enfermagem/W12_FIND_RPC_SCHEMA_GRANTS_20261031.md'

permissions:
  contents: read

jobs:
  rpc-static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run deterministic RPC grant regressions
        run: python -m unittest discover -s scripts -p 'test_spe_audit_rpc_answers.py' -v
