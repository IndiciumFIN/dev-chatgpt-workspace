name: CE canonical correction candidate gates (no release)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/kernel/**'
      - 'src/core/compliance/policy-bundle.ts'
      - 'scripts/governance/**'
      - 'registers/curiosidades/**'
      - 'audit/branch-canonicalization/**'
      - '.github/workflows/ce-audit-correction-candidate.yml'
  push:
    branches: [integration/structural-overlay-20261101]
    paths:
      - 'src/core/kernel/**'
      - 'src/core/compliance/policy-bundle.ts'
      - 'scripts/governance/**'
      - 'registers/curiosidades/**'
      - 'audit/branch-canonicalization/**'
      - '.github/workflows/ce-audit-correction-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type safety and all project tests
        run: |
          npm run typecheck
          npm test
      - name: Candidate-specific security and release invariants
        run: |
          node --test scripts/governance/release-readiness.test.mjs
          node --experimental-strip-types --test src/core/kernel/crypto.server.test.ts
          node --test scripts/governance/check-branch-audit-freshness.test.mjs
      - name: Verify MEM source registers are present, never fabricate them
        run: |
          test -f registers/curiosidades/mem-content-inventory.v1.json
          test -f registers/curiosidades/mem-source-alternatives.v1.json
          node scripts/test-curiosidades-mem.mjs
          node scripts/test-curiosidades-source-alternatives.mjs
      - name: Verify GitHub PR head SHA and branch audit freshness (fail closed)
        env:
          CI_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          node scripts/governance/check-branch-audit-freshness.mjs
