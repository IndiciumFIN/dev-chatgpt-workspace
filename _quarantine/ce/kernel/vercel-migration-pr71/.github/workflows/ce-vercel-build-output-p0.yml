name: CE Vercel Nitro build output preflight (NO DEPLOY)
on:
  push:
    branches:
      - fix/ce-tanstack-vercel-build-no-migrations-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-nitro-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: ""
      VITE_AUTH_ENABLED: "false"
    steps:
      - name: Checkout reviewed code, no persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Check safe build config and explicit migration boundary
        run: node --test scripts/vercel-build-gate.test.mjs
      - name: Test migration preflight and duplicate-SQL HOLD without connecting to database
        run: node --test scripts/migration-preflight.test.mjs
      - name: Verify validated Nitro version is locked for reproducible builds
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
            const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
            if(pkg.dependencies.nitro!=="3.0.261103-rc" ||
               lock.packages?.[""]?.dependencies?.nitro!=="3.0.261103-rc" ||
               lock.packages?.["node_modules/nitro"]?.version!=="3.0.261103-rc") process.exit(1);
            console.log("NITRO_PIN_AND_LOCKFILE VERIFIED");
          '
      - name: Compile Nitro output without deployment or migrations
        run: npm run build
      - name: Validate Vercel Build Output API v3 with real functions
        run: node scripts/verify-vercel-build-output.mjs
      - name: Smoke-test SSR over localhost with synthetic no-DB settings
        run: node scripts/check-local-ssr-preview.mjs
