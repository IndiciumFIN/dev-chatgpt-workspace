name: CKO - Atomic intake strict schema regression (HOLD)
on:
  push:
    branches: [audit/cko-atomic-intake-schema-20261114]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  strict-intake:
    name: Reject false-positive schema conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install standard JSON Schema 2020-12 validator
        run: python -m pip install "jsonschema==4.26.0"
      - name: Compile read-only audit
        run: python -m compileall -q scripts/cko-atomic-intake-guard.py scripts/test_cko_atomic_intake_guard.py
      - name: Negative schema and integrity tests against actual canonical schema
        run: python -m unittest discover -s scripts -p 'test_cko_atomic_intake_guard.py' -v
      - name: Ensure no uploaded source material was imported to public repository
        run: |
          test ! -d imports/intake-2026-11-14
          test ! -f CKO-DIS-000001-Diabetes-Mellitus-Tipo-2.json
