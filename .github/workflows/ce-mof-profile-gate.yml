name: CE | MOF Profile Decision — EMOF CMOF Governance
on:
  workflow_dispatch:
  push:
    branches:
      - canonical/supabase-skeleton-20261101
    paths:
      - 'registers/canonical/mof-profile-decision.v1.json'
      - 'scripts/ce-agents/check-mof-profile-decision.mjs'
      - '.github/workflows/ce-mof-profile-gate.yml'
permissions:
  contents: read
jobs:
  inspect-profile-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate provenance, reuse, no accidental conformance or production release
        run: node scripts/ce-agents/check-mof-profile-decision.mjs
