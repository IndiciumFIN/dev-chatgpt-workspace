name: WU-TRIB Pilot - Deterministic Gates
on:
  push:
    branches:
      - wutrib/web-pilot-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    if: github.ref == 'refs/heads/wutrib/web-pilot-20261108'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated WU-TRIB commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up reviewed Node.js toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Deterministic multi-domain gates
        run: npm run verify
      - name: Unit regression suite
        run: npm test
      - name: Verify isolated Vercel HTTPS preview
        env:
          PREVIEW_URL: https://wutrib-auditor-web-piloto-hjcqxcqys-leivisml-7739s-projects.vercel.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 30 "$PREVIEW_URL/" -o /tmp/wutrib-page.html
          grep -q 'WU-TRIB' /tmp/wutrib-page.html
          grep -q 'src/ui.js' /tmp/wutrib-page.html
          grep -q 'v0.2.1' /tmp/wutrib-page.html
          for path in /styles.css /src/ui.js /src/audit.js /src/fixtures.js; do
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 30 "$PREVIEW_URL$path" -o /dev/null
          done
          echo 'WU-TRIB HTTPS smoke: PASS (HTML and four static assets)'
