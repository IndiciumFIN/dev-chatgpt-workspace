name: Materializar ISO com os contratos existentes, sem publicar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-transversal-iso.yml'
jobs:
  materialize:
    if: github.repository == 'IndiciumFIN/dev-chatgpt-workspace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Preparar validador JSON Schema 2020-12
        run: python3 -m pip install --disable-pip-version-check "jsonschema==4.25.1"
      - name: Materializar candidatos de metadados, sem acessar ISO
        run: python3 scripts/materialize-transversal-iso.py
      - name: Conferir integridade e escopo da escrita
        run: |
          git add -- registers/governance/transversal-source-instances registers/governance/transversal-standards-candidates.v1.json registers/pmo/queue.v1.json
          git diff --cached --check
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              registers/governance/transversal-source-instances/*|registers/governance/transversal-standards-candidates.v1.json|registers/pmo/queue.v1.json) ;;
              *) echo "HOLD: unexpected file $path"; exit 1 ;;
            esac
          done
          node scripts/check-transversal-catalog.mjs
      - name: Commit sem branch adicional nem force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "HOLD: no work"; exit 1; }
          git commit -m "chore(governance): materializar 18 fontes ISO candidatas e vinculos HOLD"
          git push origin HEAD:main
