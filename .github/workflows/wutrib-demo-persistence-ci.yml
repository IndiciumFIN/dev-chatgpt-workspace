name: WU-TRIB v0.4.2 candidate - identity and tenant security
on:
  push:
    branches: [wutrib/demo-persistence-v04-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-contract:
    if: github.ref == 'refs/heads/wutrib/demo-persistence-v04-20261108'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version: '22'
      - name: Six deterministic agents
        run: npm run verify
      - name: Existing and new Node tests
        run: npm test
      - name: Audit SQL permission contract
        run: |
          set -euo pipefail
          grep -q 'security invoker' db/wutrib_demo_v04.sql
          grep -q 'revoke execute' db/wutrib_demo_v04.sql
          grep -q 'DEMO_PERSISTENCE_DISABLED' api/demo-casefiles.js
          grep -q 'demo_casefiles_strict_fixture_v041' db/wutrib_demo_v041_hardening.sql
          grep -q 'revoke execute on function public.wutrib_demo_casefile_save_v1' db/wutrib_demo_v041_hardening.sql
          grep -q 'wutrib_demo_org_casefile_save_v1' api/demo-casefiles.js
          grep -q 'wutrib_demo_request_gate_v1' api/demo-casefiles.js
          grep -q 'wutrib_demo_org_authorize_v1' api/demo-casefiles.js
          grep -q 'WUTRIB_DEMO_AUTH_ENABLED' api/demo-casefiles.js
          grep -q 'demo_org_memberships_v1' db/wutrib_demo_v042_org_auth.sql
          grep -q 'demo_org_audit_events_v1' db/wutrib_demo_v042_org_auth.sql
          grep -q 'revoke execute on function public.wutrib_demo_casefile_get_v1' db/wutrib_demo_v042_org_auth.sql
          echo 'Candidate requires separate DDL and credentials gates before API activation'

      - name: HTTPS smoke on isolated v0.4.1 candidate (no credentials)
        env:
          PREVIEW_URL: https://wutrib-auditor-web-piloto-6r7fz1zt7-leivisml-7739s-projects.vercel.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 30 "$PREVIEW_URL/" -o /tmp/wutrib-candidate.html
          grep -q 'WU-TRIB' /tmp/wutrib-candidate.html
          grep -q 'v0.3.0' /tmp/wutrib-candidate.html
          for path in /styles.css /src/ui.js /src/audit.js /src/fixtures.js /src/triage.js /src/demo-persistence-contract.js; do
            curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 30 "$PREVIEW_URL$path" -o /dev/null
          done
          status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -o /tmp/wutrib-candidate-api.json -w '%{http_code}' "$PREVIEW_URL/api/demo-casefiles")"
          test "$status" = "503"
          grep -q 'DEMO_PERSISTENCE_DISABLED' /tmp/wutrib-candidate-api.json
          echo "WU-TRIB v0.4.1 preview HTTPS: PASS; API fail-closed: 503"
