name: CE frozen chrome parity (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/styles.css'
      - 'contracts/entities/chrome-bands.v1.json'
      - 'scripts/generate-entity-contracts.mjs'
      - 'scripts/check-chrome-canonical-parity.mjs'
      - '.github/workflows/ce-chrome-canonical-parity.yml'
  push:
    branches:
      - fix/ce-chrome-frozen-tokens-source-20261114
permissions:
  contents: read
jobs:
  archived-ds-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify frozen design values and generator parity
        run: node scripts/check-chrome-canonical-parity.mjs
