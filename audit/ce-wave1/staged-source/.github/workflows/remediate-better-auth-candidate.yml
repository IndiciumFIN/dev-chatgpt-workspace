name: Validate better-auth candidate (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/remediate-better-auth-candidate.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/auth/client.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: better-auth-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: >-
      github.repository == 'IndiciumFIN/dev-chatgpt-workspace' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact event ref (no push token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Fail closed if incompatible better-auth is present
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.dependencies?.['better-auth'] !== '1.7.14') {
            throw Error('BETTER_AUTH_NOT_REVIEWED: correct and review in separate authorized WO; no auto-push');
          }
          const src = fs.readFileSync('src/lib/auth/client.ts','utf8');
          if (!src.includes('authClient.signIn.social(') ||
              src.includes('genericOAuthClient') || src.includes('signIn.oauth2(')) {
            throw Error('UNREVIEWED_OAUTH_CLIENT_API');
          }
          NODE
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:spa
      - name: Ensure workflow never silently changed source
        run: test -z "$(git status --porcelain -- package.json package-lock.json src/lib/auth/client.ts)"
