# Read-only CI: never push, merge or deploy from this workflow.
name: Verificar bibliotecas — sem deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Validar entradas e simular exclusões de upload da Vercel
        run: |
          critical_files=(
            audit/baseline/v0.1.0/file-register.json
            audit/registers/current.json
            contracts/cko-tokens/dist/_cko-universal-content-tokens.scss
            contracts/cko-tokens/dist/cko-universal-content-tokens.css
            contracts/cko-tokens/dist/cko-universal-content-tokens.ts
          )
          ignored="$(git ls-files --cached --ignored --exclude-from=.vercelignore -- "${critical_files[@]}")"
          if [ -n "$ignored" ]; then
            echo "::error::.vercelignore descarta entradas obrigatorias dos gates"
            printf '%s\n' "$ignored"
            exit 1
          fi
          for file in "${critical_files[@]}"; do
            test -s "$file" || { echo "::error::Falta arquivo de build: $file"; exit 1; }
          done
          # Mesmo conjunto de arquivos que Vercel prepara para npm ci/build.
          git ls-files --cached --ignored --exclude-from=.vercelignore -z | xargs -0 -r rm -f
          echo "PASS: entradas criticas preservadas; exclusoes Vercel simuladas"
      - name: Validar PMO canônico e histórico
        run: node scripts/check-pmo-queue.mjs
      - run: npm ci
      - run: node scripts/test-admin-console.mjs
      - run: npm run typecheck
      - run: node scripts/check-generated-fresh.mjs
      - run: node scripts/check-cko-packages.mjs
      - run: node scripts/check-contract-coverage.mjs
      - run: npm test
      - run: node scripts/audit-execution-gates.mjs
      - run: npm run build:spa
      - name: Verificar arquivos estaticos basicos
        run: test -s .vercel/output/static/index.html && test -s .vercel/output/static/sitemap.xml && test -s .vercel/output/static/robots.txt
