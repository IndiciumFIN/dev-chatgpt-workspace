name: Global master 854 evidence custody gate
on:
  push:
    branches: [feat/research-all-tools-candidate-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence_hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22" }
      - run: node scripts/audit-global-master-inventory.mjs
