name: Aquisição transversal — atos oficiais públicos, isolada
on:
  push:
    branches: [main]
    paths:
      - 'scripts/acquire-transversal-public.py'
      - '.github/workflows/acquire-transversal-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Extrair atos oficiais, com hash, sem material licenciado
        run: python3 scripts/acquire-transversal-public.py
      - name: Integridade do manifesto gerado
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          m=json.loads(pathlib.Path('audit-evidence/transversal-acquisition/manifest.json').read_text())
          assert m['summary']['items']==47
          for a in m['items']:
              if a['bodyStored']:
                  p=pathlib.Path(a['originalPath'])
                  assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==a['sourceSha256']
                  t=pathlib.Path(a['extractedPath'])
                  assert t.is_file() and hashlib.sha256(t.read_bytes()).hexdigest()==a['textSha256']
          print('PASS: SHA-256 and manifest of downloaded official texts verified')
          PY
      - name: Preservar corpus de aquisição e blockers, sem push ou deploy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transversal-public-acquisition
          path: audit-evidence/transversal-acquisition/
          if-no-files-found: warn
          retention-days: 30
