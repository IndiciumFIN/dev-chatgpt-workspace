# Read-only CI: never push, merge or deploy from this workflow.
name: Verificar bibliotecas — sem deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Validar PMO canônico e histórico
        run: node scripts/check-pmo-queue.mjs
      - name: Testar atividades e bloqueios DeepSeek (sem chamadas externas)
        run: node --test scripts/test-gov-activities.mjs
      - name: Verificar integridade do inventário transversal candidato (não conformidade)
        run: node scripts/check-transversal-catalog.mjs
      - name: Auditar 18 instâncias ISO com schemas canônicos, hashes e testes negativos (sem admissão)
        run: |
          python3 -m pip install --disable-pip-version-check "jsonschema==4.25.1"
          python3 scripts/verify-transversal-iso-materialization.py
      - name: Auditar 25 fontes públicas candidatas contra originais e schemas (sem admissão)
        run: python3 scripts/verify-transversal-public-materialization.py
      - name: Verificar índice mecânico de 21 atos públicos por offsets e hashes (sem interpretar)
        run: python3 scripts/verify-transversal-public-article-index.py
      - name: Validar lote CKO/COFEN e hashes dos registros
        run: node scripts/check-candidate-find-register.mjs
      # O checkout integral contém evidências que não devem integrar o deploy.
      # Primeiro executar os gates normativos, depois simular .vercelignore.
      - name: Validar entradas e simular exclusões de upload da Vercel
        run: |
          critical_files=(
            audit/baseline/v0.1.0/file-register.json
            audit/registers/current.json
            contracts/cko-tokens/dist/_cko-universal-content-tokens.scss
            contracts/cko-tokens/dist/cko-universal-content-tokens.css
            contracts/cko-tokens/dist/cko-universal-content-tokens.ts
          )
          ignored="$(git ls-files --cached --ignored --exclude-from=.vercelignore -- "${critical_files[@]}")"
          if [ -n "$ignored" ]; then
            echo "::error::.vercelignore descarta entradas obrigatorias dos gates"
            printf '%s\n' "$ignored"
            exit 1
          fi
          for file in "${critical_files[@]}"; do
            test -s "$file" || { echo "::error::Falta arquivo de build: $file"; exit 1; }
          done
          # Mesmo conjunto de arquivos que Vercel prepara para npm ci/build.
          git ls-files --cached --ignored --exclude-from=.vercelignore -z | xargs -0 -r rm -f
          echo "PASS: entradas criticas preservadas; exclusoes Vercel simuladas"
      - run: npm ci
      - name: Auditoria de dependências bloqueante
        run: npm audit --audit-level=high
      - run: node scripts/test-admin-console.mjs
      - run: npm run typecheck
      - run: node scripts/check-generated-fresh.mjs
      - run: node scripts/check-cko-packages.mjs
      - run: node scripts/check-contract-coverage.mjs
      - run: npm test
      - run: node scripts/audit-execution-gates.mjs
      - run: npm run build:spa
      - name: Verificar arquivos estaticos basicos
        run: test -s .vercel/output/static/index.html && test -s .vercel/output/static/sitemap.xml && test -s .vercel/output/static/robots.txt
